apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ubestrefa-issuer
spec:
  acme:
    email: serwer@ubestrefa.pl
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: ubestrefa-issuer-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token

